<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vingly — 비밀번호 재설정</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><rect width='28' height='28' rx='7' fill='%2300B37E'/><path d='M7 14L12 19L21 10' stroke='%230A0C10' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C0E12; --ink-60:rgba(12,14,18,.6); --ink-35:rgba(12,14,18,.35);
  --ink-14:rgba(12,14,18,.14); --ink-06:rgba(12,14,18,.06);
  --canvas:#F5F4F0; --white:#fff;
  --blue:#1D4ED8; --green:#00B37E; --green-bg:#E6FBF4;
  --red:#DC2626; --red-bg:#FEF2F2;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:var(--canvas);color:var(--ink);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:400px;background:var(--white);border-radius:18px;padding:36px 30px;box-shadow:0 8px 40px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:28px}
.logo-gem{width:30px;height:30px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center}
.logo-name{font-size:18px;font-weight:800;letter-spacing:-.4px}
.title{font-size:22px;font-weight:800;letter-spacing:-.8px;margin-bottom:6px}
.sub{font-size:13.5px;color:var(--ink-60);line-height:1.6;margin-bottom:24px}
.fg{margin-bottom:14px}
.fl{font:700 13px/1 'Pretendard',sans-serif;display:block;margin-bottom:6px}
.pw-wrap{position:relative}
.fi{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--ink-14);background:var(--ink-06);font:400 16px/1 'Pretendard',sans-serif;outline:none;transition:all .18s;min-height:48px}
.pw-wrap .fi{padding-right:46px}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.1);background:var(--white)}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-35);font-size:15px;padding:4px}
.hint{font-size:12px;color:var(--ink-35);margin-top:5px;line-height:1.5}
.hint.err{color:var(--red)}
.hint.ok{color:var(--green)}
.btn{width:100%;padding:14px;border-radius:11px;background:var(--ink);color:#fff;border:none;font:800 16px/1 'Pretendard',sans-serif;cursor:pointer;min-height:52px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn:hover{background:#1a1d24}
.btn:disabled{opacity:.6;cursor:not-allowed}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:none}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{display:none}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;align-items:flex-start;gap:8px;line-height:1.5}
.alert.on{display:flex}
.alert-err{background:var(--red-bg);color:var(--red)}
.alert-ok{background:var(--green-bg);color:var(--green)}
.foot{text-align:center;margin-top:20px}
.foot a{font-size:13px;color:var(--blue);text-decoration:none;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-gem">
      <svg viewBox="0 0 28 28" fill="none" width="30" height="30"><rect width="28" height="28" rx="7" fill="#00B37E"/><path d="M7 14 L12 19 L21 10" stroke="#0A0C10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span class="logo-name">Vingly</span>
  </div>

  <!-- 유효한 재설정 링크로 들어온 경우 -->
  <div id="reset-view">
    <div class="title">새 비밀번호 설정</div>
    <div class="sub">안전한 새 비밀번호를 입력해주세요.</div>

    <div class="alert alert-err" id="alertErr"><span>⚠️</span><span id="alertErrMsg"></span></div>
    <div class="alert alert-ok" id="alertOk"><span>✅</span><span id="alertOkMsg"></span></div>

    <div class="fg">
      <label class="fl">새 비밀번호</label>
      <div class="pw-wrap">
        <input class="fi" id="pw1" type="password" placeholder="6자 이상" oninput="checkPw()">
        <button class="pw-toggle" onclick="togglePw('pw1', this)">👁</button>
      </div>
      <div class="hint" id="pw1-hint">영문·숫자 조합 6자 이상을 권장합니다.</div>
    </div>
    <div class="fg">
      <label class="fl">새 비밀번호 확인</label>
      <div class="pw-wrap">
        <input class="fi" id="pw2" type="password" placeholder="한 번 더 입력" oninput="checkPw()" onkeydown="if(event.key==='Enter')doReset()">
        <button class="pw-toggle" onclick="togglePw('pw2', this)">👁</button>
      </div>
      <div class="hint" id="pw2-hint"></div>
    </div>

    <button class="btn" id="resetBtn" onclick="doReset()">
      <div class="spinner"></div><span class="btn-text">비밀번호 변경</span>
    </button>
  </div>

  <!-- 링크가 만료됐거나 잘못된 경우 -->
  <div id="invalid-view" style="display:none">
    <div class="title">링크가 만료됐어요</div>
    <div class="sub">비밀번호 재설정 링크는 일정 시간이 지나면 만료됩니다.<br>다시 요청해주세요.</div>
    <a class="btn" href="login.html" style="text-decoration:none;background:var(--ink)"><span class="btn-text">로그인 화면으로</span></a>
  </div>

  <!-- 완료 -->
  <div id="done-view" style="display:none">
    <div class="title">✅ 변경 완료</div>
    <div class="sub">비밀번호가 변경됐어요. 새 비밀번호로 로그인해주세요.</div>
    <a class="btn" href="login.html" style="text-decoration:none;background:var(--green)"><span class="btn-text">로그인하러 가기</span></a>
  </div>

  <div class="foot"><a href="login.html">← 로그인으로 돌아가기</a></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  const supabase = createClient(
    'https://hzrhpdqrrzhnhnaelaie.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6cmhwZHFycnpobmhuYWVsYWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NjE5NTgsImV4cCI6MjA5ODQzNzk1OH0.iEhPtyWD09rEp6OIJf7eN5gC0yqtj-0xlGHvS3bZZHI'
  )

  // 재설정 메일 링크를 타고 들어오면 URL에 복구 세션 정보가 담겨 있고,
  // supabase-js가 이를 감지해 PASSWORD_RECOVERY 이벤트를 준다.
  let recoveryReady = false

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || session) {
      recoveryReady = true
    }
  })

  // 링크 없이 직접 들어왔거나 만료된 경우 일정 시간 후 안내 화면으로
  setTimeout(async () => {
    const { data } = await supabase.auth.getSession()
    if (!data.session && !recoveryReady) {
      document.getElementById('reset-view').style.display = 'none'
      document.getElementById('invalid-view').style.display = 'block'
    }
  }, 1500)

  window.togglePw = function(id, btn) {
    const el = document.getElementById(id)
    el.type = el.type === 'password' ? 'text' : 'password'
  }

  window.checkPw = function() {
    const p1 = document.getElementById('pw1').value
    const p2 = document.getElementById('pw2').value
    const h1 = document.getElementById('pw1-hint')
    const h2 = document.getElementById('pw2-hint')

    if (p1 && p1.length < 6) {
      h1.textContent = '6자 이상 입력해주세요.'
      h1.className = 'hint err'
    } else if (p1) {
      h1.textContent = '사용 가능한 비밀번호입니다.'
      h1.className = 'hint ok'
    } else {
      h1.textContent = '영문·숫자 조합 6자 이상을 권장합니다.'
      h1.className = 'hint'
    }

    if (p2) {
      if (p1 === p2) { h2.textContent = '비밀번호가 일치합니다.'; h2.className = 'hint ok' }
      else { h2.textContent = '비밀번호가 일치하지 않습니다.'; h2.className = 'hint err' }
    } else {
      h2.textContent = ''; h2.className = 'hint'
    }
  }

  function showAlert(type, msg) {
    const box = document.getElementById(type === 'err' ? 'alertErr' : 'alertOk')
    document.getElementById(type === 'err' ? 'alertErrMsg' : 'alertOkMsg').textContent = msg
    box.classList.add('on')
  }

  window.doReset = async function() {
    const p1 = document.getElementById('pw1').value
    const p2 = document.getElementById('pw2').value
    document.getElementById('alertErr').classList.remove('on')

    if (!p1 || p1.length < 6) { showAlert('err', '비밀번호는 6자 이상이어야 합니다.'); return }
    if (p1 !== p2) { showAlert('err', '두 비밀번호가 일치하지 않습니다.'); return }

    const btn = document.getElementById('resetBtn')
    btn.classList.add('loading'); btn.disabled = true

    const { error } = await supabase.auth.updateUser({ password: p1 })

    btn.classList.remove('loading'); btn.disabled = false

    if (error) {
      // 세션 만료 등으로 실패한 경우
      if (/session|token|expired|jwt/i.test(error.message || '')) {
        document.getElementById('reset-view').style.display = 'none'
        document.getElementById('invalid-view').style.display = 'block'
      } else {
        showAlert('err', '변경에 실패했습니다: ' + error.message)
      }
      return
    }

    // 성공 — 재설정용 세션은 정리하고 완료 화면으로
    await supabase.auth.signOut()
    document.getElementById('reset-view').style.display = 'none'
    document.getElementById('done-view').style.display = 'block'
  }
</script>
</body>
</html>
